<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>알림 테스트 (Cookie 인증)</title>
    <style>
        body { padding: 20px; font-family: sans-serif; }
        .box { border: 1px solid #ddd; padding: 20px; border-radius: 8px; max-width: 600px; margin-bottom: 20px; }
        .log-area { background: #f8f9fa; height: 300px; overflow-y: auto; padding: 10px; border: 1px solid #eee; }
        .item { padding: 5px; border-bottom: 1px solid #eee; }
        button { padding: 8px 15px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
        input { padding: 8px; width: 200px; }
        .note { font-size: 0.9em; color: #666; margin-top: 5px; }
    </style>
</head>
<body>
<h2>📡 SSE 알림 테스트 (Cookie 방식)</h2>

<div class="box">
    <h3>1. 쿠키 확인 & 연결</h3>
    <p class="note">
        * 주의: 먼저 <strong>/api/notifications/set-cookie?token={토큰}</strong> API를 통해<br>
        브라우저에 인증 쿠키를 심어야 연결됩니다.
    </p>
    <button onclick="connect()">SSE 연결 시작</button>
    <div id="status" style="margin-top: 10px; color: red;">🔴 연결 끊김</div>
</div>

<div class="box">
    <h3>2. 알림 보내기 (테스트)</h3>
    <input type="number" id="receiverId" placeholder="받는 사람 ID (본인 ID)" value="1">
    <input type="text" id="msg" placeholder="보낼 메시지" value="안녕하세요!">
    <button onclick="sendNotification()" style="background: #28a745;">전송</button>
</div>

<div class="box">
    <h3>알림 로그</h3>
    <div id="log" class="log-area"></div>
</div>

<script>
    let eventSource = null;

    // 1. 연결 함수
    function connect() {
        if(eventSource) {
            eventSource.close();
            console.log("기존 연결 종료");
        }

        // [핵심] 쿠키 방식이므로 쿼리 파라미터(?token=...) 없이 주소만 호출합니다.
        // 브라우저가 자동으로 'accessToken' 쿠키를 헤더에 포함해 서버로 보냅니다.
        const url = '/api/notifications/subscribe';

        eventSource = new EventSource(url);

        eventSource.onopen = () => {
            console.log("SSE 연결 성공");
            document.getElementById('status').innerHTML = '🟢 서버와 연결되었습니다 (인증 성공)';
            document.getElementById('status').style.color = 'green';
            addLog('시스템', '서버와 연결되었습니다.');
        };

        eventSource.addEventListener('notification', (e) => {
            console.log("알림 수신:", e.data);
            addLog('알림 🔔', e.data);
        });

        eventSource.addEventListener('connect', (e) => {
            console.log("초기 연결 이벤트:", e.data);
            addLog('시스템', e.data);
        });

        eventSource.onerror = (e) => {
            console.error("SSE 연결 오류:", e);
            document.getElementById('status').innerHTML = '🔴 연결 끊김 (쿠키가 없거나 만료됨)';
            document.getElementById('status').style.color = 'red';
            addLog('에러', '연결이 끊어졌습니다. (개발자 도구 Console 확인 필요)');
            eventSource.close();
        };
    }

    // 2. 전송 함수 (테스트용 API가 백엔드에 있어야 작동함)
    function sendNotification() {
        const id = document.getElementById('receiverId').value;
        const content = document.getElementById('msg').value;

        // 이 API는 SecurityConfig에서 permitAll이 아니어도,
        // 이미 쿠키가 있으므로 인증을 통과해서 호출됩니다.
        fetch(`/api/notifications/send-test?receiverId=${id}&content=${content}`, {
            method: 'POST'
        })
            .then(response => {
                if (response.ok) {
                    console.log('전송 성공');
                } else {
                    alert('전송 실패: ' + response.status);
                }
            })
            .catch(err => console.error(err));
    }

    function addLog(type, msg) {
        const logDiv = document.getElementById('log');
        const time = new Date().toLocaleTimeString();
        logDiv.innerHTML = `<div class="item"><strong>[${time}] ${type}:</strong> ${msg}</div>` + logDiv.innerHTML;
    }
</script>
</body>
</html>
