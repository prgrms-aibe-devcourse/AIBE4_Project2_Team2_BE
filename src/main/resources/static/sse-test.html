<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>알림 테스트</title>
    <style>
        body { padding: 20px; font-family: sans-serif; }
        .box { border: 1px solid #ddd; padding: 20px; border-radius: 8px; max-width: 600px; margin-bottom: 20px; }
        .log-area { background: #f8f9fa; height: 300px; overflow-y: auto; padding: 10px; border: 1px solid #eee; }
        .item { padding: 5px; border-bottom: 1px solid #eee; }
        button { padding: 8px 15px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
        input { padding: 8px; width: 200px; }
    </style>
</head>
<body>
<h2>📡 SSE 알림 테스트</h2>

<div class="box">
    <h3>1. 연결하기 (로그인 시뮬레이션)</h3>
    <input type="number" id="myId" placeholder="내 ID (예: 1)" value="1">
    <button onclick="connect()">연결 시작</button>
    <div id="status" style="margin-top: 10px; color: red;">🔴 연결 끊김</div>
</div>

<div class="box">
    <h3>2. 알림 보내기 (서버 동작 시뮬레이션)</h3>
    <input type="text" id="msg" placeholder="보낼 메시지" value="안녕하세요!">
    <button onclick="sendNotification()" style="background: #28a745;">전송</button>
</div>

<div class="box">
    <h3>알림 로그</h3>
    <div id="log" class="log-area"></div>
</div>

<script>
    let eventSource = null;

    // 연결 함수
    function connect() {
        const id = document.getElementById('myId').value;
        if(eventSource) eventSource.close(); // 기존 연결 끊기

        // 컨트롤러의 /subscribe 주소 호출
        const url = `/api/notifications/subscribe?memberId=${id}`;
        eventSource = new EventSource(url);

        eventSource.onopen = () => {
            document.getElementById('status').innerHTML = '🟢 연결됨 (ID: ' + id + ')';
            document.getElementById('status').style.color = 'green';
            addLog('시스템', '서버와 연결되었습니다.');
        };

        // 서버에서 "notification"이라는 이름으로 보낼 때 받음
        eventSource.addEventListener('notification', (e) => {
            addLog('알림 🔔', e.data);
        });

        eventSource.addEventListener('connect', (e) => {
            addLog('시스템', e.data); // 초기 연결 메시지
        });
    }

    // 전송 함수 (테스트용 API 호출)
    function sendNotification() {
        const id = document.getElementById('myId').value;
        const content = document.getElementById('msg').value;

        fetch(`/api/notifications/send-test?receiverId=${id}&content=${content}`, {
            method: 'POST'
        }).then(() => {
            console.log('전송 요청 완료');
        });
    }

    function addLog(type, msg) {
        const logDiv = document.getElementById('log');
        const time = new Date().toLocaleTimeString();
        logDiv.innerHTML = `<div class="item"><strong>[${time}] ${type}:</strong> ${msg}</div>` + logDiv.innerHTML;
    }
</script>
</body>
</html>
