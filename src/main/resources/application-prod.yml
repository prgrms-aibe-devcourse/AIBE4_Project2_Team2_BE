spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  # 배포 환경에서는 성능을 위해 캐시 켜기
  thymeleaf:
    cache: true

jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    root: WARN
    kr.java.majormate: INFO
