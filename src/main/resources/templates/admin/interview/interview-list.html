<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>관리자 - 인터뷰 관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav th:replace="~{admin/fragments/header :: headerFragment}"></nav>

<div class="container mt-5">
    <h2>인터뷰 신청 관리</h2>
    <hr>

    <table class="table table-hover table-bordered text-center align-middle">
        <thead class="table-light">
        <tr>
            <th>ID</th>
            <th>제목</th>
            <th>신청자 (학생)</th>
            <th>대상자 (전공자)</th>
            <th>방식</th>
            <th>상태</th>
            <th>신청일</th>
            <th>관리</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${interviews.empty}">
            <td colspan="8">등록된 인터뷰 신청이 없습니다.</td>
        </tr>

        <tr th:each="interview : ${interviews}">
            <td th:text="${interview.interviewId}">1</td>
            <td class="text-start">
                <a th:href="@{/admin/interviews/{id}(id=${interview.interviewId})}"
                   th:text="${interview.title}" class="text-decoration-none text-dark fw-bold">
                    제목이 들어갑니다
                </a>
            </td>
            <td th:text="${interview.studentName}">김학생</td>
            <td th:text="${interview.majorName}">이전공</td>
            <td th:text="${interview.method}">ZOOM</td>
            <td>
                <span class="badge"
                      th:classappend="${interview.status == 'PENDING'} ? 'text-bg-warning' :
                                     (${interview.status == 'ACCEPTED'} ? 'text-bg-primary' :
                                     (${interview.status == 'COMPLETED'} ? 'text-bg-success' : 'text-bg-secondary'))"
                      th:text="${interview.status}">PENDING</span>
            </td>
            <td th:text="${#temporals.format(interview.createdAt, 'yyyy-MM-dd HH:mm')}">2024-01-01</td>
            <td>
                <a th:href="@{/admin/interviews/{id}(id=${interview.interviewId})}"
                   class="btn btn-sm btn-outline-primary">상세</a>
            </td>
        </tr>
        </tbody>
    </table>

    <div th:if="${interviews.totalPages > 0}" class="d-flex justify-content-center mt-4">
        <nav aria-label="Page navigation">
            <ul class="pagination">
                <li class="page-item" th:classappend="${interviews.first} ? 'disabled'">
                    <a class="page-link" th:href="@{/admin/interviews(page=${interviews.number - 1})}">&laquo;</a>
                </li>
                <li class="page-item" th:each="pageNumber : ${#numbers.sequence(1, interviews.totalPages)}"
                    th:classappend="${pageNumber == interviews.number + 1} ? 'active'">
                    <a class="page-link" th:href="@{/admin/interviews(page=${pageNumber - 1})}"
                       th:text="${pageNumber}">1</a>
                </li>
                <li class="page-item" th:classappend="${interviews.last} ? 'disabled'">
                    <a class="page-link" th:href="@{/admin/interviews(page=${interviews.number + 1})}">&raquo;</a>
                </li>
            </ul>
        </nav>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
