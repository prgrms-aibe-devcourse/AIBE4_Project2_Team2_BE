<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>전공자 승인 요청 목록</title>
    <style>
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background-color: #f4f4f4; }
        .btn { padding: 5px 10px; cursor: pointer; text-decoration: none; color: black; border: 1px solid #ccc; display: inline-block; background-color: #eee; }
        .nav-links { margin-bottom: 20px; }
        .nav-links a { margin-right: 15px; font-weight: bold; text-decoration: none; color: #555; }
        .nav-links a:hover { color: #000; text-decoration: underline; }
        .nav-links a.active { color: blue; text-decoration: underline; font-size: 1.1em; }

        /* 검색창 스타일 */
        .search-container { margin-bottom: 15px; text-align: right; background-color: #f9f9f9; padding: 10px; border-radius: 5px; }
        .search-container select, .search-container input { padding: 6px; border: 1px solid #ccc; border-radius: 3px; }
        .btn-search { background-color: #007bff; color: white; border: none; padding: 6px 12px; }
    </style>
</head>
<body>

<h2>전공자 권한 관리</h2>

<div class="nav-links">
    <a th:href="@{/admin/requests/all}" th:classappend="${viewType == 'ALL'} ? 'active'">[전체 목록]</a>
    <a th:href="@{/admin/requests/pending}" th:classappend="${viewType == 'PENDING,RESUBMITTED'} ? 'active'">[대기 목록]</a>
    <a th:href="@{/admin/requests/accepted}" th:classappend="${viewType == 'ACCEPTED'} ? 'active'">[승인된 목록]</a>
    <a th:href="@{/admin/requests/rejected}" th:classappend="${viewType == 'REJECTED'} ? 'active'">[반려된 목록]</a>
    <a th:href="@{/admin/requests/revoked}" th:classappend="${viewType == 'REVOKED'} ? 'active'">[자격 박탈 목록]</a>
</div>

<div class="search-container">
    <form method="get">
        <select name="searchType">
            <option value="name" th:selected="${searchType == 'name'}">신청자명</option>
            <option value="id" th:selected="${searchType == 'id'}">Request No</option>
        </select>
        <input type="text" name="keyword" th:value="${keyword}" placeholder="검색어를 입력하세요">
        <button type="submit" class="btn btn-search">🔍 검색</button>
        <a th:if="${keyword != null and keyword != ''}" th:href="@{''}" class="btn">초기화</a>
    </form>
</div>

<table>
    <thead>
    <tr>
        <th>No</th>
        <th>신청자</th>
        <th>대학</th>
        <th>전공</th>
        <th>상태</th>
        <th>신청일</th>
        <th>관리</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="req : ${requests}">
        <td th:text="${req.id}">1</td>
        <td th:text="${req.memberName}">홍길동</td>
        <td th:text="${req.universityName}">서울대</td>
        <td th:text="${req.majorName}">컴공</td>

        <td th:text="${req.applicationStatus}" style="font-weight: bold;">PENDING</td>

        <td th:text="${req.createdAt != null ? #temporals.format(req.createdAt, 'yyyy-MM-dd HH:mm') : '-'}">2026-01-09</td>

        <td>
            <a th:href="@{/admin/requests/{id}(id=${req.id})}" class="btn">상세보기</a>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(requests)}">
        <td colspan="7" style="padding: 20px; color: #666;">데이터가 없습니다.</td>
    </tr>
    </tbody>
</table>

</body>
</html>
