<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>전공자 승인 요청 목록</title>
    <style>
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background-color: #f4f4f4; }
        .btn { padding: 5px 10px; cursor: pointer; }
    </style>
</head>
<body>

<h2>전공자 권한 신청 목록 (관리자)</h2>

<table>
    <thead>
    <tr>
        <th>requestNo</th>
        <th>신청자</th>
        <th>대학</th>
        <th>전공</th>
        <th>상태</th>
        <th>신청일</th>
        <th>관리</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="req : ${requests}">
        <td th:text="${req.id}">1</td>

        <td>
            <a th:href="@{/admin/requests/{id}(id=${req.id})}"
               th:text="${req.memberName}"
               style="color: blue; text-decoration: underline; cursor: pointer;">
                홍길동
            </a>
        </td>

        <td th:text="${req.universityName}">서울대</td>
        <td th:text="${req.majorName}">컴공</td>
        <td th:text="${req.applicationStatus}">PENDING</td>
        <td th:text="${req.createdAt != null ? #temporals.format(req.createdAt, 'yyyy-MM-dd HH:mm') : '-'}"></td>
        <td>
            <button class="btn">승인</button>
            <button class="btn">반려</button>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
