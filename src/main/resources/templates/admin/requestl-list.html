<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>전공자 인증 요청 목록</title>
    <style>
        /* 간단한 스타일 (보기 좋게 만들기 위함) */
        body { font-family: sans-serif; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background-color: #f4f4f4; }
        .btn { padding: 5px 10px; text-decoration: none; background-color: #007bff; color: white; border-radius: 4px; }
        .btn:hover { background-color: #0056b3; }
    </style>
</head>
<body>

<h2>🎓 전공자 인증 요청 목록 (관리자용)</h2>

<table>
    <thead>
    <tr>
        <th>No.</th>
        <th>신청자 (닉네임)</th>
        <th>대학교</th>
        <th>전공</th>
        <th>상태</th>
        <th>신청일</th>
        <th>관리</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="req : ${requests}">
        <td th:text="${req.requestId}">1</td>
        <td th:text="${req.nickname}">홍길동</td>
        <td th:text="${req.university}">서울대학교</td>
        <td th:text="${req.major}">컴퓨터공학과</td>

        <td th:text="${req.applicationStatus}">PENDING</td>

        <td th:text="${#temporals.format(req.createdAt, 'yyyy-MM-dd HH:mm')}">2026-01-09 12:00</td>

        <td>
            <a class="btn" th:href="@{/admin/request/{id}(id=${req.requestId})}">심사하기</a>
        </td>
    </tr>

    <tr th:if="${#lists.isEmpty(requests)}">
        <td colspan="7">현재 대기 중인 요청이 없습니다.</td>
    </tr>
    </tbody>
</table>

</body>
</html>
