<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>관리자 대시보드</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .dashboard-card { transition: transform 0.2s; cursor: pointer; height: 100%; }
        .dashboard-card:hover { transform: translateY(-5px); background-color: #f8f9fa; }
        .card-icon { font-size: 2rem; margin-bottom: 10px; color: #0d6efd; }
    </style>
</head>
<body>

<nav th:replace="~{admin/fragments/header :: headerFragment}"></nav>

<div class="container">
    <h2 class="mb-4">관리자 메인 메뉴</h2>
    <div class="row g-4">

        <div class="col-md-6 col-lg-3">
            <div class="card dashboard-card text-center p-4">
                <div class="card-body">
                    <div class="card-icon">🎓</div>
                    <h5 class="card-title">전공자 신청 관리</h5>
                    <p class="card-text text-muted">전공 인증 서류 심사 및 승인</p>
                    <a th:href="@{/admin/major/requests/all}" class="btn btn-primary w-100 stretched-link">이동하기</a>
                </div>
            </div>
        </div>

        <div class="col-md-6 col-lg-3">
            <div class="card dashboard-card text-center p-4">
                <div class="card-body">
                    <div class="card-icon">⭐</div>
                    <h5 class="card-title">리뷰 관리</h5>
                    <p class="card-text text-muted">사용자 리뷰 모니터링 및 삭제</p>
                    <a th:href="@{/admin/reviews}" class="btn btn-primary w-100 stretched-link">이동하기</a>
                </div>
            </div>
        </div>

        <div class="col-md-6 col-lg-3">
            <div class="card dashboard-card text-center p-4">
                <div class="card-body">
                    <div class="card-icon">📝</div>
                    <h5 class="card-title">인터뷰 관리</h5>
                    <p class="card-text text-muted">인터뷰 내역 조회 및 관리</p>
                    <a th:href="@{/admin/interviews}" class="btn btn-primary w-100 stretched-link">이동하기</a>
                </div>
            </div>
        </div>

        <div class="col-md-6 col-lg-3">
            <div class="card dashboard-card text-center p-4">
                <div class="card-body">
                    <div class="card-icon">❓</div>
                    <h5 class="card-title">Q&A 관리</h5>
                    <p class="card-text text-muted">문의사항 답변 및 관리</p>
                    <a th:href="@{/admin/qna}" class="btn btn-primary w-100 stretched-link">이동하기</a>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
