<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="UTF-8">
<head>
    <meta charset="UTF-8" />
    <title>요청 상세 정보</title>
    <style>
        .container { width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #ccc; font-family: sans-serif; }
        .row { margin-bottom: 15px; }
        .label { font-weight: bold; display: inline-block; width: 100px; }
        .btn { padding: 8px 15px; cursor: pointer; text-decoration: none; border: 1px solid #ccc; background-color: #f9f9f9; color: black; border-radius: 4px; }
        .btn-accept { background-color: #28a745; color: white; border: none; }
        .btn-reject { background-color: #dc3545; color: white; border: none; }
        .btn-revoke { background-color: #ffc107; color: black; border: none; }
        .btn:disabled { background-color: #e0e0e0; color: #aaa; cursor: not-allowed; }

        .status-badge { font-weight: bold; }

        .hidden-area { display: none; margin-top: 15px; padding: 15px; background-color: #fff3cd; border: 1px solid #ffeeba; border-radius: 5px; }
        .hidden-area-reject { background-color: #f8d7da; border-color: #f5c6cb; }

        textarea { width: 95%; height: 60px; margin-top: 5px; padding: 5px; }
        hr { margin: 20px 0; border: 0; border-top: 1px solid #eee; }
    </style>
</head>
<body>

<div class="container">
    <h2>📄 요청 상세 정보</h2>

    <div class="row">
        <span class="label">신청 번호:</span>
        <span th:text="${req.id}" style="font-weight: bold; color: #555;">#123</span>
    </div>

    <div class="row">
        <span class="label">신청자:</span>
        <span th:text="${req.memberName}">홍길동</span>
    </div>
    <div class="row">
        <span class="label">대학/전공:</span>
        <span th:text="|${req.universityName} / ${req.majorName}|">서울대 / 컴공</span>
    </div>

    <div class="row">
        <span class="label">상태:</span>
        <span class="status-badge"
              th:style="${req.applicationStatus == '승인' ? 'color:green' :
                        (req.applicationStatus == '대기' ? 'color:blue' :
                        (req.applicationStatus == '재신청' ? 'color:#fd7e14' : 'color:red'))}"
              th:text="${req.applicationStatus}">대기</span>
    </div>

    <div class="row">
        <span class="label">신청일:</span>
        <span th:text="${#temporals.format(req.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></span>
    </div>

    <div class="row" th:if="${req.applicationStatus != '대기' and req.applicationStatus != '재신청' and req.decidedAt != null}">
        <span class="label">처리일:</span>
        <span th:text="${#temporals.format(req.decidedAt, 'yyyy-MM-dd HH:mm:ss')}"></span>
    </div>

    <hr/>

    <div class="row">
        <span class="label">신청 코멘트:</span>
        <div th:text="${req.comment}" style="background-color: #f8f9fa; padding: 10px; border-radius: 4px; margin-top:5px;"></div>
    </div>

    <div class="row">
        <span class="label">증빙 서류:</span>
        <div th:if="${req.documentUrl != null}">
            <div style="margin-top: 10px; margin-bottom: 10px;">
                <img th:src="${req.documentUrl}" alt="증빙 서류 미리보기"
                     style="max-width: 100%; max-height: 500px; border: 1px solid #ddd; border-radius: 4px;" />
            </div>
            <a th:href="${req.documentUrl}" target="_blank" class="btn" style="font-size: 0.8em;">🔍 새 창에서 원본 보기</a>
        </div>
        <span th:unless="${req.documentUrl != null}" style="color:gray;">
            (첨부된 서류가 없거나 보관 기한이 만료되어 삭제되었습니다)
        </span>
    </div>

    <div class="row" th:if="${req.applicationStatus == '반려' or req.applicationStatus == '자격 박탈' or (req.applicationStatus == '재신청' and req.reason != null)}">
        <hr/>
        <span class="label" style="color: red;"
              th:text="${req.applicationStatus == '재신청' ? '이전 반려 사유:' : '사유:'}">사유:</span>

        <div th:text="${req.reason}" style="color: #721c24; background-color: #f8d7da; padding: 10px; border: 1px solid #f5c6cb; border-radius: 4px;"></div>
    </div>

    <div class="row" th:if="${not #lists.isEmpty(req.histories)}" style="margin-top: 20px;">
        <h4 style="border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 10px;">📝 진행 이력 (History)</h4>
        <table style="width: 100%; border-collapse: collapse; font-size: 0.9em;">
            <thead>
            <tr style="background-color: #f8f9fa; border-bottom: 1px solid #dee2e6;">
                <th style="padding: 8px; text-align: left; color: #495057;">시각</th>
                <th style="padding: 8px; text-align: left; color: #495057;">상태</th>
                <th style="padding: 8px; text-align: left; color: #495057;">처리자</th>
                <th style="padding: 8px; text-align: left; color: #495057;">메시지/사유</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="history : ${req.histories}" style="border-bottom: 1px solid #f1f1f1;">
                <td th:text="${#temporals.format(history.changedAt, 'yyyy-MM-dd HH:mm')}" style="padding: 8px; color: #666;"></td>
                <td style="padding: 8px;">
                     <span th:text="${history.toStatus}"
                           th:style="${history.toStatus == 'ACCEPTED' ? 'color:green; font-weight:bold;' :
                                     (history.toStatus == 'REJECTED' ? 'color:red; font-weight:bold;' : 'color:#555')}">
                     </span>
                </td>
                <td th:text="${history.changedByNickname != null ? history.changedByNickname : '-'}" style="padding: 8px; color: #666;"></td>
                <td style="padding: 8px; color: #333;">
                    <span th:if="${history.reason != null and history.reason != ''}" th:text="${history.reason}"></span>
                    <span th:unless="${history.reason != null and history.reason != ''}" style="color: #ccc;">-</span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <hr/>

    <div th:if="${req.applicationStatus == '대기' or req.applicationStatus == '재신청'}">

        <form th:action="@{/admin/requests/{id}/accept(id=${req.id})}" method="post" style="display: inline-block;">
            <button type="submit" id="btnAccept" class="btn btn-accept" onclick="return confirm('승인하시겠습니까?');">✅ 승인</button>
        </form>

        <button type="button" id="btnShowReject" class="btn btn-reject" onclick="openRejectForm()">❌ 반려</button>

        <div id="rejectArea" class="hidden-area hidden-area-reject">
            <h4 style="margin-top:0; color:#721c24;">반려 사유 입력</h4>
            <form th:action="@{/admin/requests/{id}/reject(id=${req.id})}" method="post">
                <label>
                    <textarea name="reason" placeholder="반려 사유를 입력하세요..." required></textarea>
                </label>
                <div style="margin-top: 10px; text-align: right;">
                    <button type="button" class="btn" onclick="closeRejectForm()">취소</button>
                    <button type="submit" class="btn btn-reject">반려 확정</button>
                </div>
            </form>
        </div>
    </div>

    <div th:if="${req.applicationStatus == '승인'}">
        <h4 style="color: green;">✔ 승인된 사용자입니다.</h4>

        <button type="button" id="btnShowRevoke" class="btn btn-revoke" onclick="openRevokeForm()">⚠️ 자격 박탈</button>

        <div id="revokeArea" class="hidden-area">
            <h4 style="margin-top:0; color:#856404;">자격 박탈 사유 입력</h4>
            <p style="font-size:0.9em;">3-1. 승인일 이후 발생한 사유여야 합니다.</p>
            <form th:action="@{/admin/requests/{id}/revoke(id=${req.id})}" method="post">
                <label>
                    <textarea name="reason" placeholder="박탈 사유를 입력하세요 (예: 위조 적발)" required></textarea>
                </label>
                <div style="margin-top: 10px; text-align: right;">
                    <button type="button" class="btn" onclick="closeRevokeForm()">취소</button>
                    <button type="submit" class="btn btn-revoke" onclick="return confirm('정말 박탈하시겠습니까?');">박탈 확정</button>
                </div>
            </form>
        </div>
    </div>

    <div style="margin-top: 30px; text-align: center;">
        <a th:if="${req.applicationStatus == '승인'}" th:href="@{/admin/requests/accepted}" class="btn">목록으로 (승인됨)</a>
        <a th:elif="${req.applicationStatus == '반려'}" th:href="@{/admin/requests/rejected}" class="btn">목록으로 (반려됨)</a>
        <a th:elif="${req.applicationStatus == '자격 박탈'}" th:href="@{/admin/requests/revoked}" class="btn">목록으로 (박탈됨)</a>

        <a th:if="${req.applicationStatus == '대기' or req.applicationStatus == '재신청'}"
           th:href="@{/admin/requests/pending}" class="btn">목록으로 (대기/재신청)</a>
    </div>

</div>

<script>
    function openRejectForm() {
        document.getElementById('rejectArea').style.display = 'block';
        document.getElementById('btnShowReject').style.display = 'none';

        const acceptBtn = document.getElementById('btnAccept');
        if(acceptBtn) {
            acceptBtn.disabled = true;
            acceptBtn.innerHTML = "반려 작성 중...";
        }
    }

    function closeRejectForm() {
        document.getElementById('rejectArea').style.display = 'none';
        document.getElementById('btnShowReject').style.display = 'inline-block';

        const acceptBtn = document.getElementById('btnAccept');
        if(acceptBtn) {
            acceptBtn.disabled = false;
            acceptBtn.innerHTML = "✅ 승인";
        }
    }

    function openRevokeForm() {
        document.getElementById('revokeArea').style.display = 'block';
        document.getElementById('btnShowRevoke').style.display = 'none';
    }

    function closeRevokeForm() {
        document.getElementById('revokeArea').style.display = 'none';
        document.getElementById('btnShowRevoke').style.display = 'inline-block';
    }
</script>

</body>
</html>
