<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>요청 상세 정보</title>
    <style>
        .container { width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #ccc; }
        .row { margin-bottom: 15px; }
        .label { font-weight: bold; display: inline-block; width: 100px; }
        .btn { padding: 5px 15px; cursor: pointer; text-decoration: none; border: 1px solid #333; background-color: #f9f9f9; color: black; }
        .btn-approve { background-color: #4CAF50; color: white; border: none; }
        .btn-reject { background-color: #f44336; color: white; border: none; }
        .btn-revoke { background-color: #ff9800; color: white; border: none; }
        textarea { width: 100%; height: 80px; margin-top: 5px; }
        hr { margin: 20px 0; }
    </style>
</head>
<body>

<div class="container">
    <h2>요청 상세 정보</h2>

    <div class="row">
        <span class="label">신청자:</span>
        <span th:text="${req.memberName}">홍길동</span>
    </div>
    <div class="row">
        <span class="label">대학/전공:</span>
        <span th:text="|${req.universityName} / ${req.majorName}|">서울대 / 컴공</span>
    </div>
    <div class="row">
        <span class="label">상태:</span>
        <span th:text="${req.applicationStatus}" style="color: blue; font-weight: bold;">PENDING</span>
    </div>
    <div class="row">
        <span class="label">신청일:</span>
        <span th:text="${#temporals.format(req.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></span>
    </div>

    <hr/>

    <div class="row">
        <span class="label">신청 코멘트:</span>
        <p th:text="${req.comment}" style="background-color: #eee; padding: 10px;">열심히 하겠습니다.</p>
    </div>
    <div class="row">
        <span class="label">증빙 서류:</span>
        <div>
            <a th:href="${req.documentUrl}" target="_blank" th:text="${req.documentUrl}">https://image-url...</a>
        </div>
    </div>

    <div class="row" th:if="${req.applicationStatus == 'REJECTED' or req.applicationStatus == 'REVOKED'}">
        <hr/>
        <span class="label" style="color: red;">처리 사유:</span>
        <p th:text="${req.reason}" style="color: red; font-weight: bold; border: 1px solid red; padding: 10px;">
            여기에 반려/박탈 사유가 표시됩니다.
        </p>
    </div>

    <hr/>

    <div th:if="${req.applicationStatus == 'PENDING' or req.applicationStatus == 'RESUBMITTED'}">
        <form th:action="@{/admin/requests/{id}/accept(id=${req.id})}" method="post" style="display: inline-block;">
            <button type="submit" class="btn btn-approve" onclick="return confirm('승인하시겠습니까?');">승인</button>
        </form>

        <form th:action="@{/admin/requests/{id}/reject(id=${req.id})}" method="post" style="margin-top: 10px;">
            <label>반려 사유:</label><br/>
            <textarea name="reason" placeholder="반려 사유를 입력하세요" required></textarea>
            <br/>
            <button type="submit" class="btn btn-reject" style="margin-top: 5px;">반려</button>
        </form>
    </div>

    <div th:if="${req.applicationStatus == 'ACCEPTED'}">
        <h3 style="color: orange;">⚠ 자격 박탈 관리</h3>
        <p>이미 승인된 사용자입니다. 필요한 경우 자격을 박탈할 수 있습니다.</p>

        <form th:action="@{/admin/requests/{id}/revoke(id=${req.id})}" method="post">
            <label>박탈 사유(필수):</label><br/>
            <textarea name="reason" placeholder="예: 졸업 증명서 위조 확인 등" required></textarea>
            <br/>
            <button type="submit" class="btn btn-revoke" style="margin-top: 5px;"
                    onclick="return confirm('정말 자격을 박탈하시겠습니까? 회원의 권한이 즉시 강등됩니다.');">
                자격 박탈
            </button>
        </form>
    </div>

    <div style="margin-top: 20px;">
        <a th:href="@{/admin/requests}" class="btn">목록으로</a>
    </div>

</div>

</body>
</html>
