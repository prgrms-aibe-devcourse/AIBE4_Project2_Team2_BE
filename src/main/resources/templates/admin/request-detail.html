<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>전공자 신청 상세</title>
    <style>
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        .info-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        .info-table th, .info-table td { border: 1px solid #ddd; padding: 10px; }
        .info-table th { background-color: #f4f4f4; width: 150px; }
        .image-box { border: 1px solid #ccc; padding: 10px; text-align: center; background: #fafafa; }
        .image-box img { max-width: 100%; height: auto; }
        .btn-group { margin-top: 20px; text-align: center; }
        .btn { padding: 10px 20px; cursor: pointer; text-decoration: none; color: white; border: none; font-size: 16px; margin: 5px; display: inline-block;}
        .btn-approve { background-color: #28a745; }
        .btn-reject { background-color: #dc3545; }
        .btn-list { background-color: #6c757d; }
    </style>
</head>
<body>

<div class="container">
    <h2>📄 전공자 권한 신청 상세 정보</h2>

    <table class="info-table">
        <tr>
            <th>신청자</th>
            <td th:text="${req.memberName}">홍길동</td>
        </tr>
        <tr>
            <th>학교 / 전공</th>
            <td>
                <span th:text="${req.universityName}">서울대</span> /
                <span th:text="${req.majorName}">컴공</span>
            </td>
        </tr>
        <tr>
            <th>신청 상태</th>
            <td th:text="${req.applicationStatus}">PENDING</td>
        </tr>
        <tr>
            <th>신청일</th>
            <td th:text="${#temporals.format(req.createdAt, 'yyyy-MM-dd HH:mm')}">2026-01-09</td>
        </tr>
        <tr>
            <th>신청 사유</th>
            <td th:text="${req.comment}">졸업 증명서 제출합니다.</td>
        </tr>
    </table>

    <h3>📷 증빙 서류</h3>
    <div class="image-box">
        <img th:if="${req.documentUrl != null}" th:src="${req.documentUrl}" alt="증빙서류" />
        <p th:unless="${req.documentUrl != null}">첨부된 이미지가 없습니다.</p>
    </div>

    <div class="btn-group">

        <form th:action="@{/admin/requests/{id}/accept(id=${req.id})}" method="post" style="display:inline;">
            <button type="submit" class="btn btn-approve" onclick="return confirm('이 사용자를 승인하시겠습니까?');">승인</button>
        </form>

        <button type="button" class="btn btn-reject" th:onclick="'rejectRequest(' + ${req.id} + ')'">반려</button>

        <a href="/admin/requests" class="btn btn-list">목록으로</a>
    </div>

    <form id="rejectForm" method="post" style="display:none;">
        <input type="hidden" name="reason" id="rejectReason" />
    </form>

</div>

<script>
    function rejectRequest(id) {
        // 1. 브라우저 팝업으로 사유 입력받기
        const reason = prompt("반려 사유를 입력해주세요 (필수):");

        // 2. 취소했거나 내용이 없으면 중단
        if (reason === null || reason.trim() === "") {
            alert("반려 사유를 반드시 입력해야 합니다.");
            return;
        }

        // 3. 폼에 주소와 사유를 채워넣고 전송(Submit)
        const form = document.getElementById('rejectForm');
        const reasonInput = document.getElementById('rejectReason');

        form.action = '/admin/requests/' + id + '/reject'; // 주소 동적 설정
        reasonInput.value = reason; // 사유 입력

        form.submit(); // 전송
    }
</script>

</body>
</html>
