<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>후기 상세 정보</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav th:replace="~{admin/fragments/header :: headerFragment}"></nav>

<div class="container mt-5" style="max-width: 800px;">
    <h2>후기 상세 정보</h2>
    <hr>

    <div class="card mb-4">
        <div class="card-header d-flex justify-content-between">
            <h5 class="mb-0">
                Review #<span th:text="${review.reviewId}"></span>
            </h5>
            <small class="text-muted" th:text="${#temporals.format(review.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></small>
        </div>
        <div class="card-body">
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-bold">작성자 (학생)</label>
                    <input type="text" class="form-control" th:value="${review.studentName}" readonly>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">관련 전공</label>
                    <input type="text" class="form-control" th:value="${review.majorName}" readonly>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">평점</label>
                <div>
                    <span class="text-warning fs-4">
                        <span th:each="i : ${#numbers.sequence(1, review.rating)}">★</span>
                    </span>
                    <span class="text-muted"> (<span th:text="${review.rating}"></span>점)</span>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">후기 내용</label>
                <textarea class="form-control" rows="6" readonly th:text="${review.content}"></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">연관 인터뷰 ID</label>
                <input type="text" class="form-control" th:value="${review.interviewId}" readonly>
            </div>
        </div>
    </div>

    <div class="d-flex justify-content-between">
        <a href="/admin/reviews" class="btn btn-secondary">목록으로</a>

        <form th:action="@{/admin/reviews/{id}/delete(id=${review.reviewId})}" method="post"
              onsubmit="return confirm('정말 이 후기를 삭제하시겠습니까?');">
            <button type="submit" class="btn btn-danger">삭제하기</button>
        </form>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
