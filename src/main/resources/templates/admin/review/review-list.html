<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>관리자 - 후기 관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav th:replace="~{admin/fragments/header :: headerFragment}"></nav>

<div class="container mt-5">
    <h2>후기 관리</h2>
    <hr>

    <table class="table table-hover table-bordered text-center">
        <thead class="table-light">
        <tr>
            <th>ID</th>
            <th>학생 이름</th>
            <th>전공 이름</th>
            <th>평점</th>
            <th>내용 (요약)</th>
            <th>작성일</th>
            <th>관리</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${reviews.empty}">
            <td colspan="7">등록된 후기가 없습니다.</td>
        </tr>

        <tr th:each="review : ${reviews}">
            <td th:text="${review.reviewId}">1</td>
            <td th:text="${review.studentName}">형민</td>
            <td th:text="${review.majorName}">AI학과</td>
            <td>
                <span th:text="${review.rating}">5</span> / 5
            </td>
            <td class="text-start">
                <span th:if="${#strings.length(review.content) > 20}"
                      th:text="${#strings.substring(review.content, 0, 20) + '...'}"></span>
                <span th:unless="${#strings.length(review.content) > 20}"
                      th:text="${review.content}"></span>
            </td>
            <td th:text="${#temporals.format(review.createdAt, 'yyyy-MM-dd HH:mm')}">2024-01-01</td>
            <td>
                <a th:href="@{/admin/reviews/{id}(id=${review.reviewId})}"
                   class="btn btn-sm btn-primary">상세</a>
            </td>
        </tr>
        </tbody>
    </table>

    <div th:if="${reviews.totalPages > 0}" class="d-flex justify-content-center">
        <nav aria-label="Page navigation">
            <ul class="pagination">
                <li class="page-item" th:each="pageNumber : ${#numbers.sequence(1, reviews.totalPages)}"
                    th:classappend="${pageNumber == reviews.number + 1} ? 'active'">
                    <a class="page-link" th:href="@{/admin/reviews(page=${pageNumber - 1})}"
                       th:text="${pageNumber}">1</a>
                </li>
            </ul>
        </nav>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
