spring:
  datasource:
    url: jdbc:mysql://localhost:3306/majormate_dev?useSSL=false&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        use_sql_comments: true
        highlight_sql: true

logging:
  level:
    root: INFO
    kr.java.majormate: DEBUG
